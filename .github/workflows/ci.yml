name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check format, lint, types, and unit tests
        run: pnpm check
      - name: Build production application
        run: pnpm build
      - name: Check generated routes
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts
      - name: Install Chromium
        run: pnpm --filter @workspace/web exec playwright install --with-deps chromium
      - name: Build isolated published content fixtures
        run: pnpm --filter @workspace/web build:fixtures
      - name: Test production application in browser
        run: pnpm --filter @workspace/web test:e2e
      - name: Check Pages activation
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --jq '.build_type' > "$RUNNER_TEMP/pages-build-type" 2> "$RUNNER_TEMP/pages-error"; then
            if [ "$(cat "$RUNNER_TEMP/pages-build-type")" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::Set Settings > Pages > Source to GitHub Actions, then rerun CI on main."
            fi
          elif grep -q 'HTTP 404' "$RUNNER_TEMP/pages-error"; then
            echo "::notice::Pages is not enabled. Upgrade to an eligible plan, enable GitHub Actions in Pages settings, then rerun CI on main."
          else
            cat "$RUNNER_TEMP/pages-error"
            exit 1
          fi
      - name: Upload verified Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: apps/web/.output/public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.verify.outputs.pages_enabled == 'true'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
