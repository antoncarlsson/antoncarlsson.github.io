name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@12.4.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check format, lint, types, and unit tests
        run: pnpm check
      - name: Build production application
        run: pnpm build
      - name: Check generated routes
        run: git diff --exit-code -- apps/web/src/routeTree.gen.ts
      - name: Install Chromium
        run: pnpm --filter @workspace/web exec playwright install --with-deps chromium
      - name: Test production application in browser
        run: pnpm --filter @workspace/web test:e2e
